<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="16" y1="12" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="64" y1="36" x2="64" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="irisCore" cx="64" cy="64" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="90%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </radialGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Base Background Circle -->
  <rect width="128" height="128" rx="28" fill="#0b0f19"/>

  <!-- Outer Cyber Shield Frame -->
  <path d="M64 14L104 28V68C104 92 86 112 64 120C42 112 24 92 24 68V28L64 14Z" 
        stroke="url(#shieldGrad)" stroke-width="4.5" stroke-linejoin="round" fill="#0f172a" fill-opacity="0.9"/>

  <!-- Inner Shield Accent Line -->
  <path d="M64 24L94 35V66C94 84 80 100 64 107C48 100 34 84 34 66V35L64 24Z" 
        stroke="#10b981" stroke-width="1.8" stroke-dasharray="4 2" stroke-opacity="0.8" fill="none"/>

  <!-- Outer Aperture Ring -->
  <circle cx="64" cy="64" r="28" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.9" fill="none"/>

  <!-- Forensic Reticle Crosshair Ticks -->
  <line x1="16" y1="64" x2="112" y2="64" stroke="#22d3ee" stroke-width="1.8" stroke-opacity="0.75"/>
  <line x1="64" y1="28" x2="64" y2="100" stroke="#22d3ee" stroke-width="1.8" stroke-opacity="0.75"/>

  <!-- Central Camera Aperture Blades & Biometric Iris -->
  <circle cx="64" cy="64" r="18" fill="url(#irisCore)" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="8" fill="#020617"/>
  <circle cx="61" cy="61" r="3" fill="#ffffff" opacity="0.9"/>

  <!-- Status / Verification Emerald Spark -->
  <circle cx="98" cy="64" r="3" fill="#10b981"/>
  <circle cx="30" cy="64" r="3" fill="#10b981"/>
</svg>
